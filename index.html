<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>博客主页</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"></link>
</head>
<body>
  <div id="app"></div>
  <script>
   window.$docsify = {
      name: 'blog home',
      relativePath: true,      // ✅ 添加：启用相对路径模式
      homePage: 'README.md',   // ✅ 确保与实际文件名一致（大写）
      routerMode: 'hash',      // ✅ 使用 hash 模式避免 404
      loadSidebar: false,      // 可选：禁用侧边栏
      loadNavbar: false        // 可选：禁用导航栏
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
